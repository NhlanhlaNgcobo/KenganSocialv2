# Separate project and volumes; reuses the existing Hostinger Traefik HTTPS proxy.
name: kengansocial-beta
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }
x-api: &api
  build: ../../server
  image: kengansocial-beta-api:local
  restart: unless-stopped
  logging: *logging
  env_file: ../../server/.env
  environment: &environment
    NODE_ENV: production
    PORT: 5000
    DEV_PLAN_OVERRIDE: ''
    BETA_ACCESS: 'on'
    BETA_PLAN: creator
    TRIAL_DAYS: '0'
    LAUNCH_AI_FEATURES: ''
    CLIP_TRANSCRIBE: local
    AI_FREE_FALLBACK: 'on'
    OPENROUTER_API_KEY: ''
    OPENAI_API_KEY: ''
    ELEVENLABS_API_KEY: ''
    TREBLO_API_KEY: ''
    PERPLEXITY_API_KEY: ''
    PAYFAST_MERCHANT_ID: ''
    PAYFAST_MERCHANT_KEY: ''
    PAYFAST_PASSPHRASE: ''
    PAYSTACK_SECRET_KEY: ''
    YOUTUBE_LINK_IMPORT: ''
    STORAGE_DRIVER: local
    CLIENT_URL: https://kengansocial.co.za
    FRONTEND_URL: https://kengansocial.co.za
    SERVER_URL: https://${API_DOMAIN:?Set the API hostname}
    PYTHON_API_URL: http://video:8000
    REDIS_URL: redis://redis:6379
    TMPDIR: /shared
    FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase.json
    TRUST_PROXY: '1'
  volumes:
    - ../../secrets/firebase.json:/run/secrets/firebase.json:ro
    - renders:/shared
    - uploads:/app/uploads
    - cache:/app/.cache
    - type: bind
      source: ./pilot-access.json
      target: /app/config/pilot-access.json
      read_only: true
      bind: { create_host_path: false }
  mem_limit: 1g
  cpus: 0.5
  stop_grace_period: 60s
services:
  api:
    <<: *api
    labels:
      - traefik.enable=true
      - traefik.http.routers.kengansocial-beta-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.kengansocial-beta-api.entrypoints=websecure
      - traefik.http.routers.kengansocial-beta-api.tls.certresolver=letsencrypt
      - traefik.http.services.kengansocial-beta-api.loadbalancer.server.port=5000
    depends_on:
      redis: { condition: service_healthy }
      video: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  ai-worker:
    <<: *api
    command: [npm, run, 'worker:ai-edit']
    stop_grace_period: 30m
    depends_on:
      redis: { condition: service_healthy }
      video: { condition: service_healthy }
  video:
    build: ../../python-service
    restart: unless-stopped
    logging: *logging
    env_file: ../../python-service/.env
    environment:
      PORT: 8000
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase.json
      TMPDIR: /shared
      VIDEO_TMP_DIR: /shared
      MAX_CONCURRENT_JOBS: '1'
      TRANSCRIPTION_PROVIDER: local
      CLIP_ANALYSIS_PROVIDER: local
      WHISPER_MODEL_NANO: base
    volumes: [renders:/shared, whisper-models:/root/.cache, ../../secrets/firebase.json:/run/secrets/firebase.json:ro]
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    logging: *logging
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  renders:
  uploads:
  cache:
  whisper-models:
  redis-data:
