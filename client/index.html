<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kengan-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KenganSocial</title>
    <script>
      // Apply the saved theme before React mounts so there is no dark/light flash.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('kengan-theme') || 'system'; } catch (e) {}
        var theme = pref;
        if (pref !== 'light' && pref !== 'dark') {
          theme = 'dark';
          try { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
