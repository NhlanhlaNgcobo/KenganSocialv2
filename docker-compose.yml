# Production stack for one VM (Google Compute Engine): API, video service, Redis and Caddy (HTTPS).
# The web app runs on Vercel. Step-by-step setup: docs/DEPLOY.md
#
#   API_DOMAIN=api.example.com docker compose up -d --build
#
# The API and the video service must share a disk: the API hands the video service file paths in
# the temp folder, so both containers point TMPDIR at the same volume. Run ONE copy of this stack:
# the scheduler, token refresh and webhook jobs run inside the API and must not run twice.
#
# Secrets come from server/.env and python-service/.env on the VM (never commit them).

# Docker keeps container logs forever by default and would fill the disk: rotate them.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN, e.g. api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    logging: *logging
    # On SIGTERM the API stops taking requests and lets posts being published finish (server.js).
    stop_grace_period: 60s
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      PYTHON_API_URL: http://video:8000
      REDIS_URL: redis://redis:6379
      TMPDIR: /shared
      TRUST_PROXY: 1
    # Only Caddy talks to the API; it is not published on the host.
    expose:
      - "5000"
    volumes:
      - renders:/shared
      - uploads:/app/uploads
      - cache:/app/.cache
    depends_on:
      video:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Liveness of the API itself; /api/health/ready (Redis, Firestore, video, AI worker) is for monitoring.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ai-worker:
    build: ./server
    command: ["npm", "run", "worker:ai-edit"]
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 2h
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PYTHON_API_URL: http://video:8000
      REDIS_URL: redis://redis:6379
      TMPDIR: /shared
    volumes:
      - renders:/shared
      - uploads:/app/uploads
      - cache:/app/.cache
    depends_on:
      video:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy while its heartbeat (written every 20 s) is fresh.
    healthcheck:
      test: ["CMD", "node", "-e", "const R=require('ioredis');const r=new R(process.env.REDIS_URL,{lazyConnect:true});r.get('workers:ai-edit:heartbeat').then(v=>process.exit(v&&Date.now()-Number(v)<60000?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  video:
    build: ./python-service
    restart: unless-stopped
    logging: *logging
    env_file: ./python-service/.env
    environment:
      PORT: 8000
      TMPDIR: /shared
      VIDEO_TMP_DIR: /shared
    # Internal only: the video service has no authentication of its own.
    expose:
      - "8000"
    volumes:
      - renders:/shared
      - whisper-models:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    logging: *logging
    # Append-only file so scheduled posts waiting in the queue survive a restart. noeviction: queued
    # jobs are never silently dropped; the cap turns runaway growth into errors instead of an OOM.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  renders:
  uploads:
  cache:
  whisper-models:
  redis-data:
  caddy-data:
  caddy-config:
