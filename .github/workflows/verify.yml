name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm run typecheck
        working-directory: server
      - run: npm run typecheck && npm run lint
        working-directory: client
      # Compilation only; this artifact must not be deployed without production configuration.
      - run: npm run build
        working-directory: client
        env:
          ALLOW_LOCAL_API: '1'
      - run: npm run test:security && npm run test:video-ads
        working-directory: server
      - run: python -m unittest discover -s tests -v
        working-directory: python-service
      - run: node scripts/check-shared.mjs
      - run: npm audit --audit-level=high
        working-directory: server
      - run: npm audit --audit-level=high
        working-directory: client
